name: Build and Deploy to Azure Container Apps Job

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  JOB_NAME: tender-pipeline-job
  ENVIRONMENT_NAME: etimad-env

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Required so this workflow is allowed to push to GitHub Container
    # Registry using the automatically-provided token below.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Image names must be lowercase; github.repository preserves the
      # repo's actual case, so this normalizes it.
      - name: Compute lowercase image name
        run: |
          echo "IMAGE_NAME=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # No manually-created secret needed — GITHUB_TOKEN is provided
          # automatically to every workflow run.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade

      # NOTE: trigger type is Manual — nothing runs automatically. Trigger a
      # run yourself with: az containerapp job start --name tender-pipeline-job --resource-group test
      - name: Create job if it doesn't exist yet
        run: |
          set -e
          if ! az containerapp job show --name "$JOB_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Job does not exist yet — creating it."
            az containerapp job create \
              --name "$JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ENVIRONMENT_NAME" \
              --trigger-type Manual \
              --replica-timeout 1800 \
              --replica-retry-limit 1 \
              --parallelism 1 \
              --replica-completion-count 1 \
              --image "${IMAGE_NAME}:${{ github.sha }}" \
              --cpu 1.0 --memory 2Gi
          else
            echo "Job already exists — will update it below."
          fi

      - name: Set/update the Blob storage secret
        run: |
          az containerapp job secret set \
            --name "$JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --secrets azstorageconn="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}"

      # NOTE: this OVERWRITES whatever env vars were previously set on this
      # job (e.g. if it was previously running the old Node.js/SQL version).
      - name: Update image and environment variables
        run: |
          az containerapp job update \
            --name "$JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${IMAGE_NAME}:${{ github.sha }}" \
            --set-env-vars \
              AZURE_STORAGE_CONNECTION_STRING=secretref:azstorageconn \
              BLOB_CONTAINER_NAME=bronze
